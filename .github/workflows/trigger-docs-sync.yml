name: trigger-docs-sync

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch docs sync to docs repository
        if: ${{ secrets.DOCS_REPO_DISPATCH_TOKEN != '' }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DOCS_REPO_DISPATCH_TOKEN }}
          repository: albertabayor/timetable-sa-docs
          event-type: docs-updated
          client-payload: >-
            {
              "package_repository": "${{ github.repository }}",
              "package_ref": "${{ github.ref_name }}",
              "package_sha": "${{ github.sha }}"
            }

      - name: Skip dispatch (token missing)
        if: ${{ secrets.DOCS_REPO_DISPATCH_TOKEN == '' }}
        run: |
          echo "DOCS_REPO_DISPATCH_TOKEN is not configured."
          echo "Skipping docs sync trigger."
